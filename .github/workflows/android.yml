
name: Daily Accounts Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d project
            ROOT="project"
          else
            ROOT="."
          fi

          SETTINGS=$(find "$ROOT" -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          test -f "$PROJECT_DIR/build.gradle" -o \
               -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" -o \
               -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: true
          validate-wrappers: false

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK verified: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Accounts-Manager-APK
          path: ${{ env.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
